services:
  postgres:
    image: postgres:17-alpine
    container_name: banking-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank_dev
    ports:
      # Host port defaults to 5433 to avoid clashing with a local PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts here run once, on first initialisation of the data volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
